name: Multi-Cloud Infrastructure CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate-infrastructure:
    runs-on: ubuntu-latest

    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Set up Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: 1.7.0

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Validate Master Terraform Configuration
      run: |
        cd terraform
        terraform init -backend=false
        terraform validate

    - name: Validate AWS Network Module
      run: |
        cd terraform/modules/aws_network
        terraform init -backend=false
        terraform validate

    - name: Validate Azure Network Module
      run: |
        cd terraform/modules/azure_network
        terraform init -backend=false
        terraform validate

    - name: Execute Automated Post-Migration Health Validation
      run: |
        python scripts/validate_health.py